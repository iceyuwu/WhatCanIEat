#  upload-path: C:\Users\Honmono\Pictures\try\
  upload-path: /home/admin/resource/pic/
#配置ftp文件上传
ftp:
  host: 8.163.57.20       # FTP 服务器 IP
  port: 21                  # FTP 端口，默认 21
  username: recipe_share        # FTP 用户名
  password: 1qaz!QAZ    # FTP 密码
