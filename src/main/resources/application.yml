# 服务器端口配置
server:
  port: 8080

spring:
  # 数据源（数据库配置）
  datasource:
    # 驱动名称配置
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 本地数据库
#    url: jdbc:mysql://localhost:3306/recipe_share?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # docker配置ysql://mysql-container:3306/recipe_share?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # 云服数据库
    url: jdbc:mysql://8.163.57.20:3306/recipe_share?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    # 数据库用户名
    username: recipe_share
    # 数据库密码
    password: 1qaz!QAZ

  # ai接口相关配置
  ai:
    openai:
      #千万不要将DeepSeekAPIKey提交到github上！！！
      api-key:
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

#mybatis配置
mybatis-plus:
  #  指定实体类的包地址
  type-aliases-package: com.yangyang.whatcanieat.entity
  configuration:
    #开启匹配驼峰命名
    map-underscore-to-camel-case: true

#配置文件上传路径
