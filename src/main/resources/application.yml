server:
  port: 8083

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/recipe_share?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
  ai:
    openai:
      api-key:    #千万不要将DeepSeekAPIKey提交到github上！！！
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7

mybatis-plus:
  type-aliases-package: com.yangyang.whatcanieat.entity
  configuration:
    map-underscore-to-camel-case: true
